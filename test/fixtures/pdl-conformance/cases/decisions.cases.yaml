      stages:
        - { id: review, agents: [{ ref: stub-anxiety-a }], gate: { on_failure: fail } }
    note: >
      A real anxiety-reader output (R-D12 step 0, DeepSeek), trimmed, with its DECISION line in the D46 form. The
      JSON is cut off as returned. The verdict is read from the Decision: line (negative), so the decision-only
      blocking gate fails it. Without the D46 line this output read absent. Core names the fragment's score in
      FALLBACK_SCORE_SOURCE; it does not gate (D47).

  - id: decisions/line-with-truncated-json-threshold
    covers: ["§3.2 item 1", D24, D46, D47]
    applies_to: [core, skill]
    stubs:
      stub-anxiety-a:
        raw: |-
          Assessment complete. Excerpt of a real anxiety-reader output (R-D12 step 0), trimmed; the JSON is cut off as returned.

