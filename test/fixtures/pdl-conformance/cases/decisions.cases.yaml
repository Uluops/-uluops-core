      stages:
        - { id: review, agents: [{ ref: stub-anxiety-a }], gate: { threshold: 80, on_failure: fail } }
    note: >
      The same output at a threshold gate. The cut-off JSON holds no envelope (no object carrying result), so there
      is no score (D47). Core 0.54.0 read a category object's score (27) from it and FAILED the stage on that number.
