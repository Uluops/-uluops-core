      fragment's score and names it in FALLBACK_SCORE_SOURCE (source `score`), which does not gate.

  - id: decisions/echoed-option-list
    covers: ["§3.2 item 1", D46]
    applies_to: [core, skill]
    stubs:
      stub-anxiety-a:
        raw: |-
          Assessment complete.

          Decision: CONFIDENCE_WARRANTED
          Decision: FRAGILITY_MASKED
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-anxiety-a }], gate: { on_failure: fail } }
    note: >
      Pins the hazard D46's render avoids: the first Decision: line is the one read, so an echoed list of options
      reads as its first (positive) token. Rendered agents are given one instruction line, never this list.

  - id: decisions/echoed-instruction-line
    covers: ["§3.2 item 3", D46]
    applies_to: [core, skill]
    stubs:
      stub-anxiety-a:
        raw: |-
          Assessment complete.

          Decision: <TOKEN>
          Score: 90
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-anxiety-a }], gate: { threshold: 80, on_failure: fail } }
    note: >
      An echoed D46 instruction line reads neutral (`>` is not a follow character), so the score decides.

  - id: decisions/dropped-dash-label
    covers: ["§3.2 item 3", D46]
    applies_to: [core, skill]
    stubs:
      stub-anxiety-a:
        raw: |-
          Assessment complete.

          Decision: FRAGILITY_MASKED Assessment negative
          Score: 90
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-anxiety-a }], gate: { threshold: 80, on_failure: fail } }
    note: >
      Why D46 renders the token only: a label without its dash fails the follow test and reads neutral, so a
      negative verdict passes on its score.

  - id: decisions/classifiable-without-score-at-threshold
    covers: ["§3.1 ERRORED", "§3.2 item 5", D24]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: PROCEED }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }
    note: >
      Q11. A classifiable decision cannot stand in for a missing score at a gate with a threshold:
      the agent cannot be judged against it, so it is unjudgeable, as with no decision at all.

  - id: decisions/classifiable-without-score-decision-only
    covers: ["§3.1 ERRORED", "§3.2 aggregate mode (decision-only)", D24]
    applies_to: [core, skill]
    stubs:
      stub-gate-b: { decision: PROCEED }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-b }], gate: { on_failure: fail } }
    note: The complement of Q11. At a gate with no threshold the decision suffices.

  # ── Real rendered output (§3.7) ───────────────────────────────────────
  - id: decisions/real-architect-verbatim
    covers: ["§3.7 real rendered shapes"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a:
        raw: |
          Review complete; machine-readable result follows.

