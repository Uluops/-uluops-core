# Decisions: where the decision is read, the token rule, conflicts, neutral and absent
# decisions, core's fallbacks, real rendered agent output, and the vocabulary pre-check.
# Spec v0.8.0 §3.2 items 1-6, D6, D9, D12, D13, D23, D24. Expected: ../expected/decisions.expected.yaml
#
# Unless a case says otherwise, each case is one stage `review` behind
# `gate: { threshold: 80, on_failure: fail }` (75 for the docs stub), so a passing score is
# fixed and the decision alone moves the outcome.
#
# The four `real/*` cases carry agent output copied from the rendered corpus markdown at
# commit be0a5c48: agents/v3/pre-implementation-architect-agent.md (its "JSON Output"
# example) and agents/v3/docs-validator-agent.md (its "JSON OUTPUT" template). The `-85` and
# `-filled` variants change only the values named in their notes. Re-copy them when either
# agent's output section changes shape.
cases:
  # ── Token rule (§3.2 item 3) ──────────────────────────────────────────
  - id: decisions/token-bold-with-parenthetical
    covers: ["§3.2 item 3"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: "**REVISE** (Score: 85)", score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/token-leading-glyph
    covers: ["§3.2 item 3"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: "✅ PROCEED", score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/token-trailing-period
    covers: ["§3.2 item 3"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: "REVISE.", score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/token-parenthetical
    covers: ["§3.2 item 3"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: "REVISE (pending AF-003)", score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/token-lowercase
    covers: ["§3.2 item 3"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: "revise", score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/token-not-secure
    covers: ["§3.2 item 3", D6]
    applies_to: [core, skill]
    stubs:
      stub-security-a: { decision: "NOT SECURE", score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-security-a }], gate: { threshold: 85, on_failure: fail } }

  - id: decisions/token-secure-with-conditions
    covers: ["§3.2 item 3", D6, "§7 control: core reads SECURE"]
    applies_to: [core, skill]
    stubs:
      stub-security-a: { decision: "SECURE WITH CONDITIONS", score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-security-a }], gate: { threshold: 85, on_failure: fail } }
    note: >
      H1 from the run #5 re-check. Neutral, not SECURE (core today takes the first word) and not CONDITIONAL (a model reading the phrase): all_gates_passed stays true.

  - id: decisions/token-partially-documented-with-space
    covers: ["§3.2 item 3", "circumvention A5"]
    applies_to: [core, skill]
    stubs:
      stub-docs-a: { decision: "PARTIALLY DOCUMENTED", score: 80 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-docs-a }], gate: { threshold: 75, on_failure: fail } }
    note: >
      A CONDITIONAL lost to neutral, accepted (A5). The score decides and all_gates_passed stays true.

  - id: decisions/token-unfilled-placeholder
    covers: ["§3.2 item 3"]
    applies_to: [core, skill]
    stubs:
      stub-docs-a: { decision: "[DOCUMENTED|PARTIALLY_DOCUMENTED|UNDERDOCUMENTED]", score: 80 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-docs-a }], gate: { threshold: 75, on_failure: fail } }

  - id: decisions/token-strikethrough
    covers: ["§3.2 item 3"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: "~~PROCEED~~ REVISE", score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/token-beyond-200-chars
    covers: ["§3.2 item 3"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: "********************************************************************************************************************************************************************************************************REVISE", score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }
    note: >
      The value is cut to 200 characters before leading non-letters are dropped, so nothing is left: neutral, not REVISE.

  - id: decisions/token-core-register-without-vocabulary
    covers: ["§3.2 item 4"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: FAIL, score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }
    note: >
      FAIL is not in the stub's PROCEED/REVISE vocabulary; core-register tokens classify without one.

  # ── Where the decision is read (§3.2 item 1) ──────────────────────────
  - id: decisions/path-result-before-top-level
    covers: ["§3.2 item 1", "§6 item 8"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { json: { decision: PROCEED, result: { score: 90, max_score: 100, decision: REVISE } } }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }
    note: >
      result.decision is read first. Core today reads the top level first and would pass.

  - id: decisions/path-top-level-only
    covers: ["§3.2 item 1"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { json: { decision: REVISE, result: { score: 90, max_score: 100 } } }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/path-line-only
    covers: ["§3.2 item 1"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { score: 90, line: REVISE }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/path-fallback-only
    covers: ["§3.2 item 1", D13]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { json: { summary: { decision: REVISE }, result: { score: 90, max_score: 100 } } }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }
    note: >
      summary.decision is one of core's wider sources, outside the contract: gated as absent, so the score decides. The skill never reads it.

  - id: decisions/path-status-fallback-only
    covers: ["§3.2 item 1", D13]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { json: { status: REVISE, result: { score: 90, max_score: 100 } } }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  # ── Conflicts (§3.2 item 2) ───────────────────────────────────────────
  - id: decisions/conflict-both-classify
    covers: ["§3.2 item 2"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: PROCEED, score: 90, line: REVISE }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/conflict-neutral-json-classifiable-line
    covers: ["§3.2 item 2"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: "[PROCEED|REVISE]", score: 90, line: REVISE }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/conflict-classifiable-json-neutral-line
    covers: ["§3.2 item 2"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: REVISE, score: 90, line: MAYBE }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  # ── Neutral and absent (§3.2 item 5, D6, D12) ─────────────────────────
  - id: decisions/neutral-with-passing-score
    covers: ["§3.2 item 5", D6, D12]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: MAYBE, score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/neutral-with-failing-score
    covers: ["§3.2 item 5", D6]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: MAYBE, score: 70 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/neutral-without-score
    covers: ["§3.2 item 5", "§3.1 ERRORED"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { decision: MAYBE }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/absent-with-passing-score
    covers: ["§3.2 item 5", D12]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }
    note: >
      D12 (decided 2026-10-31, 10.56 absent per 100): an absent decision at a blocking gate is ERRORED whatever the
      score. Before R-D12 the score decided and this case PASSED.

  - id: decisions/absent-with-failing-score
    covers: ["§3.2 item 5", D12]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { score: 70 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  - id: decisions/absent-without-score
    covers: ["§3.1 ERRORED"]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { raw: "The agent wrote prose and no JSON." }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: fail } }

  # ── R-D12: absent decisions by gate class, the rendered Decision: line, the envelope (D12, D46, D47) ──
  - id: decisions/absent-score-warn-gate
    covers: ["§3.2 item 5", D12]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: warn } }
    note: >
      D12 binds blocking gates only. At a warn gate an absent decision is neutral and the score decides.

  - id: decisions/absent-score-no-gate
    covers: ["§3.2 item 5", D12, D43]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }] }
    note: >
      A stage with no gate is not blocking (D43), so D12 does not apply: the absent decision is neutral.

  - id: decisions/absent-score-decision-only-blocking
    covers: ["§3.1 ERRORED", "§3.2 item 5", D12]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { score: 90 }
    pipeline:
      stages:
        - { id: review, agents: [{ ref: stub-gate-a }], gate: { on_failure: fail } }
    note: >
      A decision-only blocking gate: D12 makes the absent agent unjudgeable although it has a score.

  - id: decisions/absent-score-abort-skips-dependent
    covers: ["§3.1 ERRORED", "§3.2 failure modes", D12, D1]
    applies_to: [core, skill]
    stubs:
      stub-gate-a: { score: 90 }
      stub-gate-b: { decision: PROCEED, score: 90 }
    pipeline:
      stages:
        - { id: a, agents: [{ ref: stub-gate-a }], gate: { threshold: 80, on_failure: abort } }
        - { id: b, depends_on: [a], agents: [{ ref: stub-gate-b }], gate: { threshold: 80, on_failure: fail } }
    note: >
      An ERRORED stage takes its gate's failure mode: behind abort, its dependent is SKIPPED.

  - id: decisions/line-with-truncated-json-decision-only
    covers: ["§3.2 item 1", D46, D47]
    applies_to: [core, skill]
    stubs:
      stub-anxiety-a:
        raw: |-
          Assessment complete. Excerpt of a real anxiety-reader output (R-D12 step 0), trimmed; the JSON is cut off as returned.

